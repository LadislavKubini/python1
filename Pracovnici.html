<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Evidencia pracovníkov</title>

    <style>
        body {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            font-family: sans-serif;
            line-height: 1.5;
            color: #182635;
            background: #f5f7fa;
        }

        [hidden] {
            display: none !important;
        }

        .filtre {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input, select, button {
            box-sizing: border-box;
            padding: 8px;
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            color: #175ca4;
        }

        .tabulka {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 10px;
            border: 1px solid #b8c2cc;
            text-align: left;
        }

        th {
            background: #e8eef7;
        }

        form {
            max-width: 420px;
        }

        form input, form select {
            width: 100%;
            margin-bottom: 15px;
        }

        .akcie {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        #sprava {
            color: #235c27;
        }

        #chyba {
            color: #b00020;
        }
    </style>
</head>

<body>
    <main>
        <section id="zoznam">
            <h1>Evidencia pracovníkov</h1>

            <div class="filtre">
                <div>
                    <label for="hladanie">Vyhľadať meno</label>
                    <input
                        id="hladanie"
                        type="search"
                        autocomplete="off"
                    >
                </div>

                <div>
                    <label for="filter-oddelenie">Oddelenie</label>
                    <select id="filter-oddelenie">
                        <option value="">Všetky oddelenia</option>
                        <option value="IT">IT</option>
                        <option value="Účtovníctvo">Účtovníctvo</option>
                        <option value="Výroba">Výroba</option>
                    </select>
                </div>
            </div>

            <p id="pocet"></p>

            <div class="tabulka">
                <table aria-label="Pracovníci">
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Meno</th>
                            <th scope="col">Oddelenie</th>
                            <th scope="col">Stav</th>
                            <th scope="col">Akcia</th>
                        </tr>
                    </thead>

                    <tbody id="riadky"></tbody>
                </table>
            </div>

            <p id="prazdny-zoznam" hidden>
                Nenašli sa žiadni pracovníci.
            </p>

            <div class="akcie">
                <button id="obnovit" type="button">
                    Obnoviť testovacie údaje
                </button>
            </div>
        </section>

        <section id="detail" hidden>
            <h1>Detail pracovníka</h1>

            <form id="formular" novalidate>
                <label for="pracovnik-id">ID</label>
                <input id="pracovnik-id" type="text" readonly>

                <label for="meno">Meno</label>
                <input
                    id="meno"
                    type="text"
                    maxlength="100"
                    required
                >

                <label for="oddelenie">Oddelenie</label>
                <select id="oddelenie">
                    <option value="IT">IT</option>
                    <option value="Účtovníctvo">Účtovníctvo</option>
                    <option value="Výroba">Výroba</option>
                </select>

                <label for="stav">Stav</label>
                <select id="stav">
                    <option value="true">Aktívny</option>
                    <option value="false">Neaktívny</option>
                </select>

                <div class="akcie">
                    <button type="submit">Uložiť</button>
                    <a href="#zoznam">Späť na zoznam</a>
                </div>
            </form>
        </section>

        <p id="sprava" role="status"></p>
        <p id="chyba" role="alert"></p>
    </main>

    <script>
        "use strict";

        // Počiatočné údaje aplikácie.
        const povodniPracovnici = [
            {
                id: 1,
                meno: "Anna Nováková",
                oddelenie: "IT",
                aktivny: true
            },
            {
                id: 2,
                meno: "Peter Kováč",
                oddelenie: "Účtovníctvo",
                aktivny: true
            },
            {
                id: 3,
                meno: "Anna Malá",
                oddelenie: "Účtovníctvo",
                aktivny: false
            },
            {
                id: 4,
                meno: "Ján Horváth",
                oddelenie: "Výroba",
                aktivny: true
            },
            {
                id: 5,
                meno: "Eva Bieliková",
                oddelenie: "IT",
                aktivny: false
            }
        ];

        const klucUloziska = "cvicenie_pracovnici";
        const oddelenia = ["IT", "Účtovníctvo", "Výroba"];

        // Odkazy na HTML prvky.
        const zoznam = document.getElementById("zoznam");
        const detail = document.getElementById("detail");
        const riadky = document.getElementById("riadky");
        const hladanie = document.getElementById("hladanie");
        const filterOddelenie = document.getElementById("filter-oddelenie");
        const pocet = document.getElementById("pocet");
        const prazdnyZoznam = document.getElementById("prazdny-zoznam");
        const formular = document.getElementById("formular");
        const vstupId = document.getElementById("pracovnik-id");
        const vstupMeno = document.getElementById("meno");
        const vstupOddelenie = document.getElementById("oddelenie");
        const vstupStav = document.getElementById("stav");
        const sprava = document.getElementById("sprava");
        const chyba = document.getElementById("chyba");

        let pracovnici = nacitajPracovnikov();
        let otvoreneId = null;

        function kopiaPovodnychUdajov() {
            return povodniPracovnici.map(pracovnik => ({ ...pracovnik }));
        }

        function vymazHlasenia() {
            sprava.textContent = "";
            chyba.textContent = "";
        }

        function platneUdaje(udaje) {
            if (!Array.isArray(udaje)) {
                return false;
            }

            const identifikatory = new Set();

            for (const pracovnik of udaje) {
                if (
                    pracovnik === null ||
                    typeof pracovnik !== "object" ||
                    !Number.isInteger(pracovnik.id) ||
                    pracovnik.id <= 0 ||
                    identifikatory.has(pracovnik.id) ||
                    typeof pracovnik.meno !== "string" ||
                    pracovnik.meno.trim() === "" ||
                    pracovnik.meno.length > 100 ||
                    !oddelenia.includes(pracovnik.oddelenie) ||
                    typeof pracovnik.aktivny !== "boolean"
                ) {
                    return false;
                }

                identifikatory.add(pracovnik.id);
            }

            return true;
        }

        function nacitajPracovnikov() {
            try {
                const ulozene = localStorage.getItem(klucUloziska);

                if (ulozene === null) {
                    return kopiaPovodnychUdajov();
                }

                const udaje = JSON.parse(ulozene);

                if (!platneUdaje(udaje)) {
                    throw new Error("Neplatná štruktúra údajov.");
                }

                return udaje;
            } catch (error) {
                chyba.textContent =
                    "Uložené údaje sa nepodarilo načítať. " +
                    "Zobrazujú sa pôvodné testovacie údaje.";

                return kopiaPovodnychUdajov();
            }
        }

        function ulozPracovnikov(noveUdaje) {
            try {
                localStorage.setItem(
                    klucUloziska,
                    JSON.stringify(noveUdaje)
                );

                // Údaje v pamäti zmeníme až po úspešnom uložení.
                pracovnici = noveUdaje;
                return true;
            } catch (error) {
                chyba.textContent =
                    "Údaje sa nepodarilo uložiť do prehliadača.";

                return false;
            }
        }

        function normalizujText(text) {
            return text.trim().toLocaleLowerCase("sk");
        }

        function zobrazZoznam() {
            const hladanyText = normalizujText(hladanie.value);
            const vybraneOddelenie = filterOddelenie.value;

            const vybrani = pracovnici.filter(pracovnik => {
                const vyhovujeMeno =
                    normalizujText(pracovnik.meno).includes(hladanyText);

                const vyhovujeOddelenie =
                    vybraneOddelenie === "" ||
                    pracovnik.oddelenie === vybraneOddelenie;

                return vyhovujeMeno && vyhovujeOddelenie;
            });

            riadky.replaceChildren();

            for (const pracovnik of vybrani) {
                const riadok = document.createElement("tr");

                const hodnoty = [
                    pracovnik.id,
                    pracovnik.meno,
                    pracovnik.oddelenie,
                    pracovnik.aktivny ? "Aktívny" : "Neaktívny"
                ];

                for (const hodnota of hodnoty) {
                    const bunka = document.createElement("td");
                    bunka.textContent = String(hodnota);
                    riadok.appendChild(bunka);
                }

                const akcia = document.createElement("td");
                const odkaz = document.createElement("a");

                odkaz.href = "#pracovnik/" + pracovnik.id;
                odkaz.textContent = "Detail";

                akcia.appendChild(odkaz);
                riadok.appendChild(akcia);
                riadky.appendChild(riadok);
            }

            pocet.textContent =
                `Zobrazené záznamy: ${vybrani.length} / ${pracovnici.length}`;

            prazdnyZoznam.hidden = vybrani.length > 0;
        }

        function zobrazAktualnuStranku() {
            const zhoda = location.hash.match(/^#pracovnik\/(\d+)$/);

            otvoreneId = null;
            zoznam.hidden = false;
            detail.hidden = true;

            if (zhoda === null) {
                zobrazZoznam();
                return;
            }

            const id = Number(zhoda[1]);
            const pracovnik = pracovnici.find(osoba => osoba.id === id);

            if (pracovnik === undefined) {
                chyba.textContent = "Pracovník neexistuje.";
                zobrazZoznam();
                return;
            }

            otvoreneId = pracovnik.id;
            vstupId.value = String(pracovnik.id);
            vstupMeno.value = pracovnik.meno;
            vstupOddelenie.value = pracovnik.oddelenie;
            vstupStav.value = String(pracovnik.aktivny);

            zoznam.hidden = true;
            detail.hidden = false;
        }

        formular.addEventListener("submit", function (event) {
            event.preventDefault();
            vymazHlasenia();

            const meno = vstupMeno.value.trim();

            if (meno === "") {
                chyba.textContent = "Zadajte meno pracovníka.";
                vstupMeno.focus();
                return;
            }

            if (meno.length > 100) {
                chyba.textContent = "Meno môže mať najviac 100 znakov.";
                return;
            }

            const noveUdaje = pracovnici.map(pracovnik => {
                if (pracovnik.id !== otvoreneId) {
                    return pracovnik;
                }

                return {
                    id: pracovnik.id,
                    meno: meno,
                    oddelenie: vstupOddelenie.value,
                    aktivny: vstupStav.value === "true"
                };
            });

            if (ulozPracovnikov(noveUdaje)) {
                vstupMeno.value = meno;
                sprava.textContent = "Zmeny boli uložené.";
            }
        });

        hladanie.addEventListener("input", zobrazZoznam);
        filterOddelenie.addEventListener("change", zobrazZoznam);

        window.addEventListener("hashchange", function () {
            vymazHlasenia();
            zobrazAktualnuStranku();
        });

        document.getElementById("obnovit").addEventListener(
            "click",
            function () {
                vymazHlasenia();

                if (ulozPracovnikov(kopiaPovodnychUdajov())) {
                    hladanie.value = "";
                    filterOddelenie.value = "";

                    zobrazZoznam();
                    sprava.textContent = "Testovacie údaje boli obnovené.";
                }
            }
        );

        zobrazAktualnuStranku();
    </script>
</body>
</html>
